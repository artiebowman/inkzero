<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240" font-family="Helvetica, Arial, sans-serif" fill="#111">
  <rect width="800" height="240" fill="#fff"/>
  <text x="20" y="32" font-size="15" font-weight="bold">The five pips, one per card zone. A pip shows only what the player watched happen.</text>

  <!-- 1 ink: hexagon, the ink symbol players already read -->
  <g transform="translate(80,100)">
    <path d="M0 -32 C0 -32 -22 0 -22 10 a22 22 0 0 0 44 0 C22 0 0 -32 0 -32 Z" fill="#111"/>
    <text x="0" y="62" font-size="13" text-anchor="middle" font-weight="bold">Ink</text>
    <text x="0" y="82" font-size="11" text-anchor="middle" fill="#555">seen revealed and</text>
    <text x="0" y="96" font-size="11" text-anchor="middle" fill="#555">put in the inkwell</text>
  </g>

  <!-- 2 discard: card with X -->
  <g transform="translate(240,100)">
    <rect x="-16" y="-28" width="32" height="50" rx="3" fill="none" stroke="#111" stroke-width="2.5"/>
    <line x1="-11" y1="-21" x2="11" y2="15" stroke="#111" stroke-width="3.5"/>
    <line x1="11" y1="-21" x2="-11" y2="15" stroke="#111" stroke-width="3.5"/>
    <text x="0" y="62" font-size="13" text-anchor="middle" font-weight="bold">Discard</text>
    <text x="0" y="82" font-size="11" text-anchor="middle" fill="#555">seen going to</text>
    <text x="0" y="96" font-size="11" text-anchor="middle" fill="#555">the discard pile</text>
  </g>

  <!-- 3 deck: stack -->
  <g transform="translate(400,100)">
    <rect x="-8" y="-16" width="30" height="44" rx="3" fill="#fff" stroke="#111" stroke-width="2"/>
    <rect x="-13" y="-22" width="30" height="44" rx="3" fill="#fff" stroke="#111" stroke-width="2"/>
    <rect x="-18" y="-28" width="30" height="44" rx="3" fill="#ddd" stroke="#111" stroke-width="2"/>
    <text x="0" y="62" font-size="13" text-anchor="middle" font-weight="bold">Deck</text>
    <text x="0" y="82" font-size="11" text-anchor="middle" fill="#555">seen going back</text>
    <text x="0" y="96" font-size="11" text-anchor="middle" fill="#555">into the deck</text>
  </g>

  <!-- 4 hand -->
  <g transform="translate(560,100)">
    <rect x="-12" y="-4" width="26" height="28" rx="6" fill="#111"/>
    <rect x="-12" y="-26" width="5" height="28" rx="2.5" fill="#111"/>
    <rect x="-5" y="-30" width="5" height="32" rx="2.5" fill="#111"/>
    <rect x="2" y="-28" width="5" height="30" rx="2.5" fill="#111"/>
    <rect x="9" y="-23" width="5" height="25" rx="2.5" fill="#111"/>
    <rect x="-21" y="-8" width="6" height="20" rx="3" fill="#111" transform="rotate(-30 -18 2)"/>
    <text x="0" y="62" font-size="13" text-anchor="middle" font-weight="bold">Hand</text>
    <text x="0" y="82" font-size="11" text-anchor="middle" fill="#555">revealed or bounced to hand,</text>
    <text x="0" y="96" font-size="11" text-anchor="middle" fill="#555">not played since</text>
  </g>

  <!-- 5 blank: ghost card -->
  <g transform="translate(720,100)">
    <rect x="-16" y="-28" width="32" height="50" rx="3" fill="none" stroke="#999" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="0" y="62" font-size="13" text-anchor="middle" font-weight="bold">Blank</text>
    <text x="0" y="82" font-size="11" text-anchor="middle" fill="#555">not seen yet: hand, deck,</text>
    <text x="0" y="96" font-size="11" text-anchor="middle" fill="#555">or face-down by an effect</text>
  </g>

  <text x="20" y="226" font-size="11" fill="#555"># Draft icons, to be adjusted.</text>
</svg>
