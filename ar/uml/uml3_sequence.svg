<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" font-family="Helvetica, Arial, sans-serif" fill="#111">
  <rect width="1040" height="600" fill="#fff"/>
  <text x="20" y="20" font-size="12" font-weight="bold">InkZero AR</text>
  <text x="20" y="34" font-size="11" fill="#555">Sequence diagram, one turn</text>
  <defs>
    <marker id="call" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#111"/></marker>
    <marker id="ret" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#111" stroke-width="1.2"/></marker>
  </defs>

  <!-- lifeline heads -->
  <g font-size="12" text-anchor="middle">
    <g transform="translate(100,70)"><rect x="-60" width="120" height="32" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/><text x="0" y="20">Operator</text></g>
    <g transform="translate(290,70)"><rect x="-60" width="120" height="32" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="0" y="20">TurnStepper</text></g>
    <g transform="translate(480,70)"><rect x="-60" width="120" height="32" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="0" y="20">GameState</text></g>
    <g transform="translate(670,70)"><rect x="-60" width="120" height="32" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="0" y="20">CountingEngine</text></g>
    <g transform="translate(870,70)"><rect x="-65" width="130" height="32" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="0" y="20">OverlayDrawer</text></g>
  </g>
  <g stroke="#999" stroke-width="1.2" stroke-dasharray="5 4">
    <line x1="100" y1="102" x2="100" y2="500"/><line x1="290" y1="102" x2="290" y2="500"/>
    <line x1="480" y1="102" x2="480" y2="500"/><line x1="670" y1="102" x2="670" y2="500"/><line x1="870" y1="102" x2="870" y2="500"/>
  </g>

  <!-- activation bars -->
  <g fill="#eee" stroke="#111" stroke-width="1">
    <rect x="285" y="140" width="10" height="330"/>
    <rect x="475" y="176" width="10" height="84"/>
    <rect x="665" y="296" width="10" height="70"/>
    <rect x="865" y="402" width="10" height="68"/>
  </g>

  <!-- messages -->
  <g stroke="#111" stroke-width="1.5" fill="none">
    <line x1="100" y1="140" x2="283" y2="140" marker-end="url(#call)"/>
    <line x1="295" y1="176" x2="473" y2="176" marker-end="url(#call)"/>
    <line x1="473" y1="260" x2="295" y2="260" stroke-dasharray="4 3" marker-end="url(#ret)"/>
    <line x1="295" y1="296" x2="663" y2="296" marker-end="url(#call)"/>
    <line x1="663" y1="366" x2="295" y2="366" stroke-dasharray="4 3" marker-end="url(#ret)"/>
    <line x1="295" y1="402" x2="863" y2="402" marker-end="url(#call)"/>
  </g>
  <path d="M485 200 h34 v28 h-34" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#call)"/>

  <g font-size="11">
    <rect x="112" y="108" width="156" height="30" fill="#fff"/>
    <text x="190" y="120" text-anchor="middle">OnLaptopCommand("next")</text>
    <text x="190" y="133" text-anchor="middle" fill="#555" font-size="10">right arrow, over USB</text>
    <rect x="352" y="157" width="64" height="16" fill="#fff"/>
    <text x="384" y="169" text-anchor="middle">NextTurn()</text>
    <text x="526" y="210">apply the zone changes for turn + 1</text>
    <text x="526" y="224" fill="#555" font-size="10">cardZones, positions, counts</text>
    <text x="384" y="253" text-anchor="middle" fill="#555">done</text>
    <rect x="396" y="277" width="166" height="16" fill="#fff"/>
    <text x="479" y="289" text-anchor="middle">BuildOverlayRows(gameState)</text>
    <rect x="444" y="347" width="70" height="16" fill="#fff"/>
    <text x="479" y="359" text-anchor="middle" fill="#555">OverlayRow[]</text>
    <rect x="466" y="383" width="226" height="16" fill="#fff"/>
    <text x="579" y="395" text-anchor="middle">DrawOverlay(OverlayRow[], gameCounts)</text>
    <rect x="780" y="480" width="180" height="14" fill="#fff"/>
    <text x="870" y="490" text-anchor="middle" fill="#555" font-size="10">redraw rows and counts in passthrough</text>
  </g>

  <!-- latency bracket, labeled horizontally -->
  <line x1="960" y1="140" x2="960" y2="470" stroke="#111" stroke-width="1"/>
  <line x1="954" y1="140" x2="966" y2="140" stroke="#111"/><line x1="954" y1="470" x2="966" y2="470" stroke="#111"/>
  <rect x="902" y="118" width="116" height="14" fill="#fff"/>
  <text x="960" y="128" font-size="10" fill="#555" text-anchor="middle">latency, measured here</text>
  

  <text x="20" y="540" font-size="12" fill="#555"># TurnStepper drives the turn, so GameState never has to know the engine or the display exist. PreviousTurn() is the same with the zone changes undone.</text>
  <text x="20" y="560" font-size="12" fill="#555"># Before any turn: ScriptedGameLoader.LoadScriptedGame() fills GameState, and OverlayDrawer.PinMat() takes the four corner pinches.</text>
  <text x="20" y="580" font-size="12" fill="#555"># Latency is measured from the command arriving at TurnStepper to the frame OverlayDrawer draws.</text>
</svg>
