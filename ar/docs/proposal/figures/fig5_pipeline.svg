<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" font-family="Helvetica, Arial, sans-serif" fill="#111">
  <rect width="960" height="320" fill="#fff"/>
  <text x="20" y="20" font-size="12" font-weight="bold">InkZero AR</text>
  <text x="20" y="34" font-size="11" fill="#555">Figure 5 · Pipeline</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111"/>
    </marker>
  </defs>

  <rect x="190" y="84" width="740" height="170" rx="10" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="920" y="76" font-size="11" text-anchor="end" fill="#555">inside the headset</text>

  <!-- scene file -->
  <g transform="translate(30,110)">
    <rect width="130" height="70" rx="6" fill="#f2f2f2" stroke="#111" stroke-width="2"/>
    <text x="65" y="32" font-size="13" text-anchor="middle" font-weight="bold">scripted game</text>
    <text x="65" y="50" font-size="11" text-anchor="middle" fill="#555">both decks,</text>
    <text x="65" y="63" font-size="10" text-anchor="middle" fill="#555">every zone change</text>
  </g>

  <!-- ScriptedGameLoader -->
  <g transform="translate(210,110)">
    <rect width="130" height="70" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="65" y="30" font-size="12" text-anchor="middle" font-weight="bold">ScriptedGameLoader</text>
    <text x="65" y="52" font-size="11" text-anchor="middle" fill="#555">loads</text>
  </g>

  <!-- GameState -->
  <g transform="translate(390,110)">
    <rect width="130" height="70" rx="6" fill="#fff" stroke="#111" stroke-width="2.5"/>
    <text x="65" y="30" font-size="13" text-anchor="middle" font-weight="bold">GameState</text>
    <text x="65" y="52" font-size="11" text-anchor="middle" fill="#555">holds, applies</text>
  </g>

  <!-- CountingEngine -->
  <g transform="translate(570,110)">
    <rect width="130" height="70" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="65" y="30" font-size="13" text-anchor="middle" font-weight="bold">CountingEngine</text>
    <text x="65" y="52" font-size="11" text-anchor="middle" fill="#555">builds rows</text>
  </g>

  <!-- OverlayDrawer -->
  <g transform="translate(750,110)">
    <rect width="150" height="70" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="75" y="30" font-size="13" text-anchor="middle" font-weight="bold">OverlayDrawer</text>
    <text x="75" y="52" font-size="11" text-anchor="middle" fill="#555">draws</text>
  </g>

  <line x1="160" y1="145" x2="208" y2="145" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="145" x2="388" y2="145" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="145" x2="568" y2="145" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="145" x2="748" y2="145" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- TurnStepper under GameState -->
  <g transform="translate(390,212)">
    <rect width="130" height="28" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="65" y="18" font-size="12" text-anchor="middle" font-weight="bold">TurnStepper</text>
  </g>
  <line x1="455" y1="212" x2="455" y2="182" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="200" font-size="10" fill="#555">steps turns</text>

  <!-- laptop -->
  <g transform="translate(30,210)">
    <rect width="130" height="32" rx="6" fill="#f2f2f2" stroke="#111" stroke-width="2"/>
    <text x="65" y="20" font-size="12" text-anchor="middle" font-weight="bold">laptop</text>
  </g>
  <line x1="160" y1="226" x2="388" y2="226" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="274" y="220" font-size="10" text-anchor="middle" fill="#555">next / back, over USB</text>

  <text x="30" y="290" font-size="12" fill="#555"># In the full InkZero system, Recognition (the camera) would replace ScriptedGameLoader and TurnStepper, and a MachineLearningEngine would replace CountingEngine.</text>
</svg>
