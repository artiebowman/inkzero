<svg xmlns="http://www.w3.org/2000/svg" width="905" height="636" viewBox="10 0 905 636" font-family="Helvetica, Arial, sans-serif" fill="#111">
  <rect width="900" height="640" fill="#fff"/>
  <defs>
    <g id="inkfan5">
      <rect x="0" y="0" width="28" height="38" fill="#c9c9c9" stroke="#111" stroke-width="1.2"/>
      <rect x="12" y="0" width="28" height="38" fill="#c9c9c9" stroke="#111" stroke-width="1.2"/>
      <rect x="24" y="0" width="28" height="38" fill="#c9c9c9" stroke="#111" stroke-width="1.2"/>
      <rect x="36" y="0" width="28" height="38" fill="#c9c9c9" stroke="#111" stroke-width="1.2"/>
      <rect x="48" y="0" width="28" height="38" fill="#c9c9c9" stroke="#111" stroke-width="1.2"/>
    </g>
    <g id="person">
      <circle cx="0" cy="-10" r="6" fill="none" stroke="#111" stroke-width="2"/>
      <path d="M-11 8 Q0 -4 11 8" fill="none" stroke="#111" stroke-width="2"/>
    </g>
    <g id="headset">
      <rect x="-30" y="0" width="60" height="22" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
      <rect x="-22" y="5" width="18" height="12" rx="3" fill="#ddd"/>
      <rect x="4" y="5" width="18" height="12" rx="3" fill="#ddd"/>
    </g>
    <g id="matbase">
      <!-- opponent half -->
      <rect x="20" y="52" width="300" height="210" fill="#f4f4f4" stroke="#111" stroke-width="2"/>
      <!-- ink zone, far strip -->
      <rect x="100" y="58" width="212" height="70" fill="none" stroke="#777" stroke-width="1.2" stroke-dasharray="5 4"/>
      <use href="#inkfan5" x="140" y="64"/>
      <text x="206" y="120" font-size="9" text-anchor="middle" fill="#555">inkwell, face-down</text>
      <!-- deck/discard zone, pushed to the near edge -->
      <rect x="26" y="118" width="66" height="138" fill="none" stroke="#777" stroke-width="1.2" stroke-dasharray="5 4"/>
      <rect x="43" y="126" width="32" height="46" fill="#eee" stroke="#111" stroke-width="1.5"/>
      <text x="59" y="184" font-size="9" text-anchor="middle">discard</text>
      <rect x="43" y="196" width="32" height="46" fill="#ddd" stroke="#111" stroke-width="1.5"/>
      <text x="59" y="252" font-size="9" text-anchor="middle">deck</text>
      <!-- play zone, near strip -->
      <rect x="100" y="136" width="212" height="120" fill="none" stroke="#777" stroke-width="1.2" stroke-dasharray="5 4"/>

      <!-- player half, mirrored, faded, no labels -->
      <rect x="20" y="272" width="300" height="210" fill="#f4f4f4" stroke="#111" stroke-width="2"/>
      <g opacity="0.12">
        <rect x="120" y="296" width="40" height="56" fill="#888" stroke="#111" stroke-width="1.5"/>
        <rect x="190" y="296" width="40" height="56" fill="#888" stroke="#111" stroke-width="1.5"/>
        <rect x="265" y="282" width="32" height="46" fill="#888" stroke="#111" stroke-width="1.5"/>
        <rect x="265" y="340" width="32" height="46" fill="#888" stroke="#111" stroke-width="1.5"/>
        <use href="#inkfan5" x="120" y="426"/>
      </g>
      <rect x="28" y="278" width="212" height="120" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4"/>
      <rect x="248" y="278" width="66" height="138" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4"/>
      <rect x="28" y="406" width="212" height="70" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4"/>

      <use href="#headset" x="170" y="500"/>
      <text x="170" y="540" font-size="11" text-anchor="middle">player in headset</text>
    </g>
  </defs>

  <!-- LEFT: on the cards -->
  <g transform="translate(30,20)">
    <text x="0" y="18" font-size="16" font-weight="bold">A. On the mat</text>
    <use href="#person" x="170" y="34"/><text x="192" y="46" font-size="11" fill="#555">opponent</text>
    <use href="#matbase"/>
    <g transform="translate(135,146)">
      <rect width="40" height="56" fill="#e6e6e6" stroke="#111" stroke-width="1.5"/>
      <text x="20" y="32" font-size="9" text-anchor="middle" fill="#888" transform="rotate(180 20 28)">card</text>
      <rect x="-6" y="60" width="52" height="14" rx="3" fill="#fff" stroke="#111" stroke-width="1.5"/>
      <circle cx="5" cy="67" r="3.5" fill="#111"/><circle cx="15" cy="67" r="3.5" fill="#111"/>
      <circle cx="25" cy="67" r="3.5" fill="none" stroke="#999" stroke-dasharray="2 1.5"/><circle cx="35" cy="67" r="3.5" fill="none" stroke="#999" stroke-dasharray="2 1.5"/>
      <text x="20" y="90" font-size="10" text-anchor="middle">4.5%</text>
    </g>
    <g transform="translate(210,146)">
      <rect width="40" height="56" fill="#e6e6e6" stroke="#111" stroke-width="1.5"/>
      <text x="20" y="32" font-size="9" text-anchor="middle" fill="#888" transform="rotate(180 20 28)">card</text>
      <rect x="-6" y="60" width="52" height="14" rx="3" fill="#fff" stroke="#111" stroke-width="1.5"/>
      <circle cx="5" cy="67" r="3.5" fill="#111"/>
      <circle cx="15" cy="67" r="3.5" fill="none" stroke="#999" stroke-dasharray="2 1.5"/><circle cx="25" cy="67" r="3.5" fill="none" stroke="#999" stroke-dasharray="2 1.5"/><circle cx="35" cy="67" r="3.5" fill="none" stroke="#999" stroke-dasharray="2 1.5"/>
      <text x="20" y="90" font-size="10" text-anchor="middle">6.8%</text>
    </g>
    <!-- counts strip, centered on the opponent's mat -->
    <g font-size="9" font-weight="bold">
      <rect x="40" y="254" width="262" height="16" rx="4" fill="#fff" stroke="#111" stroke-width="1.2"/>
      <text x="69" y="265" text-anchor="middle" font-weight="normal" fill="#555">opponent</text>
      <line x1="97" y1="256" x2="97" y2="268" stroke="#999"/>
      <text x="120" y="265" text-anchor="middle">hand 6</text>
      <text x="160" y="265" text-anchor="middle">ink 5</text>
      <text x="204" y="265" text-anchor="middle">deck 38</text>
      <text x="246" y="265" text-anchor="middle">disc 4</text>
      <text x="282" y="265" text-anchor="middle">lore 9</text>
    </g>
    <text x="170" y="580" font-size="12" text-anchor="middle" fill="#555">Rows drawn under the opponent's cards in play, facing the player.</text>
    <text x="170" y="596" font-size="12" text-anchor="middle" fill="#555">Counts in one strip on the opponent's near edge.</text>
  </g>

  <!-- RIGHT: panel -->
  <g transform="translate(480,20)">
    <text x="0" y="18" font-size="16" font-weight="bold">B. On a panel</text>
    <use href="#person" x="170" y="34"/><text x="192" y="46" font-size="11" fill="#555">opponent</text>
    <use href="#matbase"/>
    <g transform="translate(135,146)">
      <rect width="40" height="56" fill="#e6e6e6" stroke="#111" stroke-width="1.5"/>
      <text x="20" y="32" font-size="9" text-anchor="middle" fill="#888" transform="rotate(180 20 28)">card</text>
    </g>
    <g transform="translate(210,146)">
      <rect width="40" height="56" fill="#e6e6e6" stroke="#111" stroke-width="1.5"/>
      <text x="20" y="32" font-size="9" text-anchor="middle" fill="#888" transform="rotate(180 20 28)">card</text>
    </g>
    <g transform="translate(335,60)">
      <rect width="80" height="300" rx="4" fill="#fff" stroke="#111" stroke-width="2"/>
      <text x="40" y="-6" font-size="11" text-anchor="middle">panel</text>
      <g font-size="8" fill="#333">
        <text x="6" y="12">hand 6</text><text x="40" y="12">ink 5</text>
        <text x="6" y="22">deck 38</text><text x="40" y="22">disc 4</text>
        <text x="6" y="32">lore 9</text>
        <line x1="4" y1="37" x2="76" y2="37" stroke="#bbb"/>
      </g>
      <g font-size="9" transform="translate(0,34)">
        <g transform="translate(6,10)"><rect width="10" height="14" fill="#ccc"/><circle cx="18" cy="7" r="2.5" fill="#111"/><circle cx="25" cy="7" r="2.5" fill="#111"/><circle cx="32" cy="7" r="2.5" fill="none" stroke="#999"/><circle cx="39" cy="7" r="2.5" fill="none" stroke="#999"/><text x="68" y="10" text-anchor="end">4.5%</text></g>
        <g transform="translate(6,30)"><rect width="10" height="14" fill="#ccc"/><circle cx="18" cy="7" r="2.5" fill="#111"/><circle cx="25" cy="7" r="2.5" fill="none" stroke="#999"/><circle cx="32" cy="7" r="2.5" fill="none" stroke="#999"/><circle cx="39" cy="7" r="2.5" fill="none" stroke="#999"/><text x="68" y="10" text-anchor="end">6.8%</text></g>
        <g transform="translate(6,50)"><rect width="10" height="14" fill="#ccc"/><circle cx="18" cy="7" r="2.5" fill="none" stroke="#999"/><circle cx="25" cy="7" r="2.5" fill="none" stroke="#999"/><circle cx="32" cy="7" r="2.5" fill="none" stroke="#999"/><circle cx="39" cy="7" r="2.5" fill="none" stroke="#999"/><text x="68" y="10" text-anchor="end">9.1%</text></g>
        <g transform="translate(6,70)"><rect width="10" height="14" fill="#ccc"/><circle cx="18" cy="7" r="2.5" fill="#111"/><circle cx="25" cy="7" r="2.5" fill="#111"/><circle cx="32" cy="7" r="2.5" fill="#111"/><circle cx="39" cy="7" r="2.5" fill="none" stroke="#999"/><text x="68" y="10" text-anchor="end">2.3%</text></g>
        <text x="40" y="100" text-anchor="middle" fill="#777">…</text>
        <text x="40" y="222" text-anchor="middle" fill="#555">one row</text>
        <text x="40" y="234" text-anchor="middle" fill="#555">per card,</text>
        <text x="40" y="246" text-anchor="middle" fill="#555">by cost,</text>
        <text x="40" y="258" text-anchor="middle" fill="#555">then type</text>
      </g>
    </g>
    <text x="170" y="580" font-size="12" text-anchor="middle" fill="#555">Rows and counts moved off the cards and the mat</text>
    <text x="170" y="596" font-size="12" text-anchor="middle" fill="#555">into one fixed panel beside the mat.</text>
  </g>
</svg>
